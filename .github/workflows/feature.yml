name: Feature Integration 🧩

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  build-lint-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Check formatting
        run: test -z "$(goimports -l .)"

      - name: Check go.mod is tidy
        run: go mod tidy && git diff --exit-code go.mod

      - name: Build
        run: go build -v ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  container-vulnerability-scan:
    name: Container vulnerabilities / Trivy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [relay, connector]
    steps:
      - uses: actions/checkout@v7

      - id: scan-changes
        uses: minitap-ai/devops-common/.github/actions/container-scan-changes@v8
        with:
          additional-paths: |
            .github/workflows/feature.yml
            **/*.go
            go.mod
            go.sum

      - name: Build image
        if: steps.scan-changes.outputs.should-scan == 'true'
        run: docker build --build-arg TARGET=${{ matrix.target }} --tag minitest-connector-${{ matrix.target }}:pr .

      - name: Scan image
        if: steps.scan-changes.outputs.should-scan == 'true'
        uses: minitap-ai/devops-common/.github/actions/trivy-container-vulnerability-scan@v8
        with:
          image-ref: minitest-connector-${{ matrix.target }}:pr
          exit-code: "1"
          artifact-name: trivy-${{ matrix.target }}
