name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  binaries:
    name: Binaries, GitHub release, Homebrew cask
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  install-script:
    name: install.sh on ${{ matrix.os }}
    needs: binaries
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install the release just published
        env:
          MINITEST_CONNECTOR_VERSION: ${{ github.ref_name }}
          INSTALL_DIR: ${{ runner.temp }}/bin
        run: sh install.sh
      - name: Check the version
        run: test "$("$RUNNER_TEMP/bin/minitest-connector" version)" = "$GITHUB_REF_NAME"
