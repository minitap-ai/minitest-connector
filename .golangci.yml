version: "2"

linters:
  enable:
    - gosec
  settings:
    errcheck:
      exclude-functions:
        - (io.ReadCloser).Close
        - (net.Conn).Close
        - (net/http.ResponseWriter).Write
        - (*encoding/json.Encoder).Encode
        - io.WriteString
  exclusions:
    rules:
      # Only launchctl/systemctl with arguments built from our own layout.
      - path: internal/service/
        linters: [gosec]
        text: G204
